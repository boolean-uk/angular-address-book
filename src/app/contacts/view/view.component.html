<ng-container *ngIf="contact; else notFound">
  <h1>{{ contact.firstName }} {{ contact.lastName }}</h1>
  <p>{{ contact.street }}, {{ contact.city }}</p>
  <a [routerLink]="['/contacts', contact.id, 'edit']">Edit</a>
</ng-container>
<ng-template #notFound>
  <h1>Contact not found</h1>
</ng-template>

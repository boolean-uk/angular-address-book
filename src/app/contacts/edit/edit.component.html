<div>
  <h2>Edit Contact</h2>
  <form [formGroup]="contactForm" (ngSubmit)="editContact()" class="form-group">
    <div>
      <label for="name" class="form-control">Name:</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
      />
    </div>

    <div>
      <label for="phone" class="form-control">Phone:</label>
      <input
        type="text"
        id="phone"
        formControlName="phone"
        class="form-control"
      />
    </div>

    <div>
      <label for="email" class="form-control">Email:</label>
      <input
        type="text"
        id="email"
        formControlName="email"
        class="form-control"
      />
    </div>
    <div>
      <label for="address" class="form-control" 
        >Address:</label
      >
      <input
        type="text"
        id="address"
        formControlName="address"
        class="form-control"
      />
    </div>

    <button type="submit" [disabled]="contactForm.invalid" class="btn btn-success">
      Edit Contact
    </button>
  </form>
</div>

<table class="table table-striped">
    <thead>
        <td>Id</td>
        <td>Name</td>
        <td>Phone</td>
        <td>Email</td>
        <td>Address</td>
    </thead>
    <tbody>
        <tr *ngFor="let contact of contacts">
            <td>
                <a routerLink="/contacts/{{ contact.id }}" class="btn btn-primary">
                    <span class=""badge>{{ contact.id }}</span>
                </a>
            </td>
            <td> {{ contact.name }} </td>
            <td> {{ contact.phone }} </td>
            <td> {{ contact.email }} </td>
            <td> {{ contact.address }} </td>
        </tr>
    </tbody>
</table>

<h2>Contact List Page</h2>
<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody>
    @for (contact of this.contacts; track contact) {
    <tr>
      <td>{{ contact.id }}</td>
      <td>{{ contact.firstName }}</td>
      <td>{{ contact.lastName }}</td>
      <td><a routerLink="/contacts/{{ contact.id }}">Link</a></td>
    </tr>
    }
  </tbody>
</table>

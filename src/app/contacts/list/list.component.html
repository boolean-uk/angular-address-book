<h2>Contacts list</h2>
<div class="contact-container">
    @for (contact of contacts; track contact.id ) {
        <div class="contact">
            <span>{{contact.name}}</span>
            <a routerLink='/contacts/{{ contact.id }}'>View</a>
            <a routerLink='/contacts/edit/{{ contact.id }}'>Edit</a>
        </div>
    }
</div>
